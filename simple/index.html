<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30-DAY Sprechen</title>
<style>
  /* Layout: one centered column. Kalender on top, then Thema, structures, one record button. */
  :root {
    --bg: #ffffff;
    --ink: #14161f;
    --muted: #5b6070;
    --line: #e3e6ee;
    --soft: #f5f6fa;
    --accent: #4338ca;
    --rec: #dc2626;
    --done: #15803d;
    color-scheme: light;
  }
  * { box-sizing: border-box; font-style: normal; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 56px; display: flex; flex-direction: column; gap: 28px; }

  /* Top bar: the 30-DAY title opens the Kalender */
  .top { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brandbtn {
    display: inline-flex; align-items: center; gap: 10px; padding: 6px 10px 6px 0; border: 0; background: none; cursor: pointer;
    border-radius: 10px;
  }
  .brand { font-weight: 800; font-size: 22px; letter-spacing: 0.01em; }
  .brand .dash { color: var(--accent); }
  .cur { font-size: 14px; font-weight: 700; color: var(--accent); background: #eef0ff; padding: 3px 10px; border-radius: 999px; }
  .chev { font-size: 12px; color: var(--muted); transition: transform 0.15s; }
  .brandbtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .count { font-size: 14px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Kalender (hidden until opened, floats above the content) */
  .cal {
    position: absolute; top: 100%; left: 0; z-index: 10; margin-top: 6px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(20, 22, 31, 0.16);
  }
  .cal[hidden] { display: none; }
  .week { display: flex; align-items: center; gap: 10px; }
  .wlabel { width: 28px; flex: none; font-size: 13px; font-weight: 800; color: var(--muted); }
  .daysrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .day {
    position: relative; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); cursor: pointer; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .day:hover { background: var(--soft); }
  .day.done { border-color: var(--done); color: var(--done); }
  .day.done::after {
    content: ""; position: absolute; right: 4px; bottom: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--done);
  }
  .day.now { background: var(--accent); border-color: var(--accent); color: #fff; }
  .day.now.done::after { background: #fff; }

  /* Thema */
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); line-height: 1.2; font-weight: 800; text-wrap: balance; }
  .thema { margin: 0 0 8px; font-size: 15px; color: var(--muted); font-weight: 600; }

  /* Structures */
  .structs { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .card-name { font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .pattern { margin: 0; font-size: 20px; font-weight: 800; }
  .stitle { margin: -4px 0 0; font-size: 14px; font-weight: 700; color: var(--accent); }
  .blocks { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 6px; }
  .block { display: inline-flex; flex-direction: column; gap: 4px; }
  .chip { padding: 6px 12px; border-radius: 10px; font-size: 17px; font-weight: 600; }
  .label { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .comma { align-self: flex-start; padding-top: 6px; font-size: 17px; font-weight: 700; color: var(--muted); }
  .t-einstieg { background: #ede9fe; color: #4c1d95; }
  .t-verb     { background: #dbeafe; color: #1e3a8a; }
  .t-subjekt  { background: #dcfce7; color: #14532d; }
  .t-rest     { background: #eef0f5; color: #2b3040; }
  .t-konj     { background: #ccfbf1; color: #0f4c47; }
  .t-rel      { background: #ccfbf1; color: #0f4c47; }
  .t-zu       { background: #fee2e2; color: #7f1d1d; }
  .t-ende     { background: #fee2e2; color: #7f1d1d; }
  .t-haupt    { background: #eef0f5; color: #2b3040; }
  .tag { font-size: 12px; font-weight: 700; color: var(--accent); background: #eef0ff; padding: 2px 10px; border-radius: 999px; }
  .types { display: flex; flex-direction: column; gap: 10px; }
  .typ { display: flex; align-items: flex-start; gap: 12px; }
  .typ-chip { flex: none; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 800; }
  .typ-text strong { font-size: 15px; }
  .typ-text .rule { margin: 2px 0 0; }
  .typ1 { background: #ede9fe; color: #4c1d95; }
  .typ2 { background: #fee2e2; color: #7f1d1d; }
  .typ3 { background: #dbeafe; color: #1e3a8a; }
  .typ4 { background: #ccfbf1; color: #0f4c47; }
  .typ5 { background: #dcfce7; color: #14532d; }
  .typ6 { background: #eef0f5; color: #2b3040; }
  .rule { margin: 0; font-size: 15px; color: var(--muted); }
  .example { margin: 0; font-size: 18px; }
  .example mark { background: #dbeafe; color: #1e3a8a; padding: 0 4px; border-radius: 4px; font-weight: 700; }

  /* Recorder: pinned to the bottom of the screen, so the record button never scrolls away */
  .rec {
    position: sticky; bottom: 12px; z-index: 5;
    border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px;
    display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: var(--soft);
    box-shadow: 0 8px 28px rgba(20, 22, 31, 0.14);
  }
  .rec-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .timer { font-size: 44px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .timer.live { color: var(--rec); }
  #recBtn {
    display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; border: 0; border-radius: 999px;
    background: var(--rec); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  #recBtn:hover { filter: brightness(0.94); }
  #recBtn .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  #recBtn.live { background: var(--ink); }
  #recBtn.live .dot { border-radius: 3px; }
  .dur { display: flex; align-items: center; gap: 8px; }
  .dur-label { font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .seg button { min-width: 38px; padding: 6px 0; border: 0; background: var(--bg); font-weight: 700; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:disabled { opacity: 0.45; cursor: default; }
  .msg { margin: 0; font-size: 14px; color: var(--muted); }
  .msg.err { color: #b91c1c; }
  audio { width: 100%; height: 40px; }
  audio[hidden] { display: none; }

  @media (max-width: 520px) {
    .timer { font-size: 38px; }
    #recBtn { padding: 12px 20px; font-size: 17px; }
    .rec { bottom: 8px; padding: 12px 14px; }
    .daysrow { gap: 4px; }
    .day { width: 31px; height: 34px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    #recBtn { transition: background 0.15s, filter 0.15s; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <button class="brandbtn" id="calBtn" aria-expanded="false" aria-controls="cal" aria-label="Kalender öffnen">
      <span class="brand">30<span class="dash">-</span>DAY</span>
      <span class="cur" id="cur"></span>
      <span class="chev" aria-hidden="true">&#9662;</span>
    </button>
    <div class="count" id="count"></div>
    <nav class="cal" id="cal" aria-label="Kalender" hidden></nav>
  </header>

  <main id="content" style="display:flex;flex-direction:column;gap:28px"></main>

</div>

<script src="../data.js"></script>
<script>
/* Inhalt (Tag 1 bis 30) kommt aus ../data.js, dem Trainingsplan deiner App. */
var DAYS = (window.TD && window.TD.DAYS) || [];
var TOTAL = 30;
var WEEKS = { 1: { von: 1, bis: 7 }, 2: { von: 8, bis: 14 }, 3: { von: 15, bis: 21 }, 4: { von: 22, bis: 30 } };

/* ------------------------------------------------------------------ */
function weekOf(day) {
  for (var w = 1; w <= 4; w++) { if (day >= WEEKS[w].von && day <= WEEKS[w].bis) return w; }
  return 4;
}

var KEY_DAY = "30day-sprechen-tag", KEY_DONE = "30day-sprechen-erledigt";
var current = 1, done = {};
try {
  var s0 = parseInt(localStorage.getItem(KEY_DAY), 10); if (s0 >= 1 && s0 <= TOTAL) current = s0;
  done = JSON.parse(localStorage.getItem(KEY_DONE) || "{}") || {};
} catch (e) {}

var content = document.getElementById("content");
var cal = document.getElementById("cal");
var countEl = document.getElementById("count");
var calBtn = document.getElementById("calBtn");
var curEl = document.getElementById("cur");

function setCal(open) {
  cal.hidden = !open;
  calBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
calBtn.addEventListener("click", function (e) { e.stopPropagation(); setCal(cal.hidden); });
cal.addEventListener("click", function (e) { e.stopPropagation(); });
document.addEventListener("click", function () { setCal(false); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !cal.hidden) { setCal(false); calBtn.focus(); } });

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

/* ---------- Kalender ---------- */
function renderCal() {
  cal.textContent = "";
  for (var w = 1; w <= 4; w++) {
    var row = el("div", "week");
    row.appendChild(el("span", "wlabel", "W" + w));
    var days = el("div", "daysrow");
    for (var d = WEEKS[w].von; d <= WEEKS[w].bis; d++) {
      (function (n) {
        var b = el("button", "day" + (n === current ? " now" : "") + (done[n] ? " done" : ""), String(n));
        b.setAttribute("aria-label", "Tag " + n + (done[n] ? ", erledigt" : ""));
        if (n === current) b.setAttribute("aria-current", "true");
        b.addEventListener("click", function () { current = n; setCal(false); render(); });
        days.appendChild(b);
      })(d);
    }
    row.appendChild(days);
    cal.appendChild(row);
  }
  var n = Object.keys(done).length;
  countEl.textContent = n + " / " + TOTAL + " Tage";
  curEl.textContent = "Tag " + current;
}

/* ---------- Strukturen ---------- */
var TAGLABEL = { "new": "neu", "also new": "auch neu", "review": "Wiederholung", "your choice": "deine Wahl", "instruction": "Aufgabe" };

function typeRows(p) {
  var wrap = el("div", "types");
  TD.typesOf(p).forEach(function (n) {
    var t = TD.TYPES[n], row = el("div", "typ");
    row.appendChild(el("span", "typ-chip typ" + n, "Typ " + n));
    var txt = el("div", "typ-text");
    txt.appendChild(el("strong", "", t.name));
    txt.appendChild(el("p", "rule", t.rule));
    row.appendChild(txt);
    wrap.appendChild(row);
  });
  return wrap;
}

function satzCard(name, s) {
  var c = el("section", "card");
  var head = el("div", "card-head");
  head.appendChild(el("span", "card-name", name));
  if (s.tag) head.appendChild(el("span", "tag", TAGLABEL[s.tag] || s.tag));
  c.appendChild(head);
  c.appendChild(el("p", "pattern", s.p));
  c.appendChild(el("p", "example", s.ex));
  c.appendChild(typeRows(s.p));
  return c;
}

function wortCard(w) {
  var c = el("section", "card");
  var head = el("div", "card-head");
  head.appendChild(el("span", "card-name", "Wortverbindung"));
  if (w.n === 2) head.appendChild(el("span", "tag", "2. Mal"));
  c.appendChild(head);
  c.appendChild(el("p", "pattern", w.p));
  var p = el("p", "example");
  var idx = w.ex.toLowerCase().indexOf(w.p.toLowerCase());
  if (idx >= 0) {
    p.appendChild(document.createTextNode(w.ex.slice(0, idx)));
    p.appendChild(el("mark", "", w.ex.slice(idx, idx + w.p.length)));
    p.appendChild(document.createTextNode(w.ex.slice(idx + w.p.length)));
  } else { p.textContent = w.ex; }
  c.appendChild(p);
  var rule = TD.WV[w.p] && TD.WV[w.p].rule;
  if (rule) c.appendChild(el("p", "rule", rule));
  return c;
}

/* ---------- Aufnahme ---------- */
var BEEPS = 3;                 /* Anzahl Pieptöne vor dem Start und am Ende */
var stream = null, recorder = null, chunks = [], tick = null, lastUrl = null;
var audioCtx = null, beepTimers = [], beepOscs = [], minutes = 1, phase = "idle", timeUp = false;

function getCtx() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function beeps(n, cb) {
  var c = getCtx(), gap = 0.75;
  if (!c) { beepTimers.push(setTimeout(cb, 400)); return; }
  var t0 = c.currentTime + 0.05;
  for (var i = 0; i < n; i++) {
    var t = t0 + i * gap, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.22);
    beepOscs.push(o);
  }
  beepTimers.push(setTimeout(cb, ((n - 1) * gap + 0.9) * 1000));
}

function stopBeeps() {
  beepTimers.forEach(clearTimeout); beepTimers = [];
  beepOscs.forEach(function (o) { try { o.stop(); } catch (e) {} }); beepOscs = [];
}

function stopRec(silent) {
  clearInterval(tick); tick = null;
  stopBeeps();
  if (recorder && recorder.state !== "inactive") { if (silent) recorder.onstop = null; recorder.stop(); }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  if (silent) recorder = null;
  phase = "idle";
}

function recorderPanel() {
  var box = el("section", "rec");
  var row = el("div", "rec-row");
  var timer = el("div", "timer", fmt(minutes * 60));
  var btn = el("button", "");
  btn.id = "recBtn";
  btn.appendChild(el("span", "dot"));
  var btnText = el("span", "", "Aufnehmen");
  btn.appendChild(btnText);

  var dur = el("div", "dur");
  dur.appendChild(el("span", "dur-label", "Dauer"));
  var seg = el("div", "seg");
  var segBtns = [];
  for (var m = 1; m <= 5; m++) {
    (function (mm) {
      var b = el("button", "", String(mm));
      b.setAttribute("aria-pressed", mm === minutes ? "true" : "false");
      b.setAttribute("aria-label", mm + (mm === 1 ? " Minute" : " Minuten"));
      b.addEventListener("click", function () {
        if (phase !== "idle") return;
        minutes = mm;
        segBtns.forEach(function (x, i) { x.setAttribute("aria-pressed", i + 1 === minutes ? "true" : "false"); });
        timer.textContent = fmt(minutes * 60);
        if (audio.hidden) msg.textContent = startMsg();
      });
      seg.appendChild(b); segBtns.push(b);
    })(m);
  }
  dur.appendChild(seg);
  dur.appendChild(el("span", "dur-label", "min"));

  function startMsg() {
    return "Sprich " + (minutes === 1 ? "1 Minute" : minutes + " Minuten") + " zum Thema. Vor dem Start und am Ende piept es " + BEEPS + "-mal.";
  }
  var msg = el("p", "msg", startMsg());
  var audio = document.createElement("audio");
  audio.controls = true; audio.hidden = true;
  row.appendChild(timer); row.appendChild(btn);
  box.appendChild(row); box.appendChild(dur); box.appendChild(msg); box.appendChild(audio);

  function lock(on) { segBtns.forEach(function (b) { b.disabled = on; }); }

  function idle(text) {
    phase = "idle";
    btn.classList.remove("live"); timer.classList.remove("live");
    btnText.textContent = audio.hidden ? "Aufnehmen" : "Neu aufnehmen";
    lock(false);
    if (text) { msg.textContent = text; msg.className = "msg"; }
  }

  function beginRecording() {
    var limit = minutes * 60;
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);
      audio.src = lastUrl; audio.hidden = false;
      var over = timeUp; timeUp = false;
      idle(over ? "Zeit ist um. Hör dir deine Aufnahme an." : "Hör dir deine Aufnahme an.");
      if (over) beeps(BEEPS, function () {});
      done[current] = true;
      try { localStorage.setItem(KEY_DONE, JSON.stringify(done)); } catch (e) {}
      renderCal();
    };
    recorder.start();
    phase = "recording";
    var left = limit;
    timer.textContent = fmt(left);
    timer.classList.add("live");
    btnText.textContent = "Stopp";
    msg.textContent = "Aufnahme läuft …"; msg.className = "msg";
    tick = setInterval(function () {
      left -= 1; timer.textContent = fmt(left);
      if (left <= 0) { timeUp = true; stopRec(false); }
    }, 1000);
  }

  function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
      msg.textContent = "Dieser Browser kann nicht aufnehmen. Öffne die Datei in Chrome oder Safari.";
      msg.className = "msg err"; return;
    }
    getCtx();                       /* im Klick starten, damit der Browser Töne erlaubt */
    phase = "starting"; lock(true);
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
      if (phase !== "starting") { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s; phase = "countdown";
      audio.hidden = true;
      btn.classList.add("live");
      btnText.textContent = "Abbrechen";
      timer.textContent = fmt(minutes * 60);
      msg.textContent = "Gleich geht’s los … " + BEEPS + " Pieptöne"; msg.className = "msg";
      beeps(BEEPS, function () { if (phase === "countdown") beginRecording(); });
    }).catch(function () {
      idle();
      msg.textContent = "Kein Zugriff auf das Mikrofon. Erlaube es in der Adressleiste des Browsers und versuche es erneut.";
      msg.className = "msg err";
    });
  }

  btn.addEventListener("click", function () {
    if (phase === "recording") { stopRec(false); }
    else if (phase === "countdown" || phase === "starting") {
      stopRec(true); idle(startMsg());
      timer.textContent = fmt(minutes * 60);
    }
    else { start(); }
  });
  return box;
}

/* ---------- Anzeige ---------- */
function render() {
  stopRec(true);
  try { localStorage.setItem(KEY_DAY, String(current)); } catch (e) {}
  renderCal();
  content.textContent = "";
  var d = DAYS[current - 1];
  if (!d) {
    content.appendChild(el("p", "msg err", "Die Datei data.js wurde nicht gefunden. Sie muss im Hauptordner neben dem Ordner „simple“ liegen."));
    return;
  }

  var head = el("div");
  head.appendChild(el("p", "eyebrow", "Tag " + current + " · Woche " + d.w));
  head.appendChild(el("p", "thema", "Thema: " + TD.KIND_LABEL[d.kind] + (d.kind === "q" ? " #" + d.q : "")));
  head.appendChild(el("h1", "", d.say));
  content.appendChild(head);

  var structs = el("div", "structs");
  structs.appendChild(satzCard("Satz A", d.a));
  structs.appendChild(satzCard("Satz B", d.b));
  if (d.wv) structs.appendChild(wortCard(d.wv));
  content.appendChild(structs);

  content.appendChild(recorderPanel());
}

render();
</script>
</body>
</html>
