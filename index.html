<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30-DAY · Besser sprechen in 30 Tagen</title>
<meta name="description" content="Speak about one topic a day with two sentence structures. Record, listen, repeat.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button type="button" class="icon" id="prevDay" aria-label="Previous day">‹</button>
    <button type="button" class="day-pick" id="dayPick" aria-label="Choose a day"></button>
    <button type="button" class="icon" id="nextDay" aria-label="Next day">›</button>
    <button type="button" class="icon menu" id="menuBtn" aria-label="Menu">⋯</button>
  </header>

  <section class="thema" id="thema"></section>
  <nav class="tabs" id="tabs" aria-label="Rounds"></nav>
  <section class="structure" id="structure"></section>
  <section class="build" id="build"></section>

  <section class="rec" id="rec"></section>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
